[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-agent"
version = "0.1.0"
description = "Japanese Riichi Mahjong AI agent for RiichiDev."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "takeo1116" }]
dependencies = [
  "riichienv>=0.4.8,<0.5",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mahjong_agent*"]

[tool.setuptools.package-data]
"mahjong_agent" = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
